name: Build Executa Release Assets

on:
  workflow_dispatch:
  push:
    tags:
      - 'mini-notes-summarizer-v*'

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Go tests
        run: cd executas/mini-notes-summarizer && go test ./...
      - name: Build release archives
        run: scripts/build-release-assets.sh
      - name: Smoke test Linux-built protocol via Go source
        run: |
          cd executas/mini-notes-summarizer
          echo '{"jsonrpc":"2.0","method":"describe","id":1}' | go run ./cmd/mini-notes-summarizer | grep 'mini-notes-summarizer'
      - name: Smoke test darwin archive manifest
        run: tar -tzf dist/release/mini-notes-summarizer-darwin-arm64.tar.gz | grep manifest.json
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/mini-notes-summarizer-darwin-arm64.tar.gz
            dist/release/mini-notes-summarizer-darwin-x86_64.tar.gz
            dist/release/mini-notes-summarizer-windows-x86_64.zip
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('mini-notes-summarizer-v0.1.0-{0}', github.run_number) }}
          name: Mini Notes Summarizer ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          draft: false
          prerelease: true
